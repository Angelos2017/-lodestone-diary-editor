<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>しお✦あんエディタ v3.8</title>
<style>
:root{--bg:#f3f4f6;--paper:#fff;--ink:#20242a;--muted:#8a9098;--line:#d9dde2;--btn:#fff;--accent:#426783;--warn:#c43b3b}
body.dark{--bg:#17191d;--paper:#22252a;--ink:#f2f3f5;--muted:#a7adb5;--line:#41464d;--btn:#2b2f35;--accent:#5e87a5;--warn:#ff7777}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}
.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column}
.top{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--line);padding:4px 8px}
.brandrow{height:25px;display:flex;align-items:center;gap:5px;min-width:0}
.brand{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:14px}
.brand small{font-weight:400;font-size:9px;color:var(--muted);margin-left:4px}
input,textarea,button{font:inherit;color:var(--ink);border:1px solid var(--line)}
button{flex:0 0 auto;height:28px;min-height:28px;background:var(--btn);border-radius:6px;padding:2px 6px;font-size:12px}
button:active{transform:translateY(1px)}
.mode{height:25px;min-height:25px;min-width:31px;padding:1px 5px}
.titleRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center;margin-top:2px}
#title{width:100%;height:31px;background:var(--paper);border-radius:7px;padding:4px 8px;font-size:15px;outline:none}
#title:focus,textarea:focus{border-color:var(--accent)}
.counter{font-size:9px;color:var(--muted);white-space:nowrap;min-width:33px;text-align:right}
.counter.warn{color:var(--warn);font-weight:700}
.toolbar{display:flex;align-items:center;gap:3px;overflow-x:auto;padding-top:3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.toolbar::-webkit-scrollbar{display:none}.group{display:flex;gap:3px;align-items:center;flex:0 0 auto}
.sep{width:1px;height:19px;background:var(--line);margin:0 1px;flex:0 0 auto}
.iconbtn{min-width:29px;padding:2px 5px}
.num{width:42px;height:28px;border-radius:6px;background:var(--paper);padding:2px 3px;text-align:center;font-size:12px}
.color{width:30px;height:28px;padding:2px;border-radius:6px;background:var(--paper)}
.editor{position:relative;flex:1 1 auto;min-height:0;padding:4px 8px 5px;display:flex;background:var(--bg)}
textarea{flex:1 1 auto;min-height:0;width:100%;resize:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border-radius:10px;padding:10px 12px 22px;font-size:17px;line-height:1.65;outline:none;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.bodyCount{position:absolute;right:15px;bottom:9px;z-index:2;padding:1px 4px;border-radius:5px;background:color-mix(in srgb,var(--paper) 88%,transparent);font-size:9px;color:var(--muted);pointer-events:none}
.bodyCount.warn{color:var(--warn);font-weight:700}
.bottom{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:4px;padding:4px 8px calc(4px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
.bottom button{height:29px;min-height:29px;padding:2px 4px;font-size:11px}.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.previewOverlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;overflow:auto;padding:10px}.previewOverlay.open{display:block}
.previewCard{max-width:760px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px}
.previewTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.previewTitle{font-size:21px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:11px}
.previewBody{font-family:Arial,"Yu Gothic",Meiryo,sans-serif;font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;min-height:120px}
.hidden{display:inline-block;background:#555;color:#fff;padding:2px 8px;border-radius:3px;font-size:12px}

.colorTray{display:none;margin-top:4px;padding:7px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.colorTray.open{display:block}
.colorTrayHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:11px;color:var(--muted)}
.colorSwatches{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.colorSwatches::-webkit-scrollbar{display:none}
.colorDot{position:relative;flex:0 0 29px;width:29px;height:29px;min-height:29px;border-radius:7px;border:1px solid var(--line);padding:0}
.colorDot.selected{outline:3px solid var(--ink);outline-offset:2px}
.colorDot.selected::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;text-shadow:0 1px 3px #000}
.freeColorInline{display:flex;align-items:center;gap:6px;margin-top:6px}
.freeColorInline span{font-size:11px;color:var(--muted)}
.freeColorInline input[type=color]{position:static;width:38px;height:29px;opacity:1;pointer-events:auto;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--paper)}
.freeColorInline button{height:29px}

.rainbowDot{background:conic-gradient(#ff3030,#ffd43b,#46b95c,#38a9e8,#4d5ee8,#a64bd4,#ff3030)}
.rainbowDot::after{content:'+';position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:900;color:#fff;text-shadow:0 1px 4px #000}
.currentColorDisplay{display:inline-block;width:38px;height:29px;border:1px solid var(--line);border-radius:6px;background:#ff0000}
.nativeColorPicker{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}

@media(max-width:390px){.brand{font-size:13px}.brand small{font-size:8px}}
@media(max-height:600px){.top{padding-top:2px;padding-bottom:3px}.brandrow{height:22px}.mode{height:22px;min-height:22px}#title{height:29px}.toolbar{padding-top:2px}.editor{padding-top:3px}.bottom{padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brandrow">
  <div class="brand">しお✦あんエディタ <small>Lodestone Diary Editor　v3.8</small></div>
  <button id="mode" class="mode" onclick="toggleMode()" aria-label="ダークモード">🌙</button>
 </div>
 <div class="titleRow">
  <input id="title" maxlength="50" placeholder="タイトル">
  <span id="tcBox" class="counter"><span id="tc">0</span>/50</span>
 </div>
 <div class="toolbar">
  <div class="group">
   <button id="colorButton" onclick="openColorPalette()">文字色</button>
  </div>
  <span class="sep"></span>
  <div class="group">
   <button onclick="sizeWrap(10)">10</button><button onclick="sizeWrap(12)">12</button><button onclick="sizeWrap(18)">18</button><button onclick="sizeWrap(24)">24</button><button onclick="sizeWrap(32)">32</button>
  </div>
  <span class="sep"></span>
  <div class="group">
   <button class="iconbtn" onclick="wrap('[b]','[/b]')"><b>B</b></button>
   <button class="iconbtn" onclick="wrap('[i]','[/i]')"><i>I</i></button>
   <button class="iconbtn" onclick="wrap('[u]','[/u]')"><u>U</u></button>
   <button class="iconbtn" onclick="wrap('[s]','[/s]')"><s>S</s></button>
  </div>
  <span class="sep"></span>
  <div class="group"><button onclick="wrap('[left]','[/left]')">左</button><button onclick="wrap('[center]','[/center]')">中</button><button onclick="wrap('[right]','[/right]')">右</button></div>
  <span class="sep"></span>
  <div class="group"><button onclick="addLink()">リンク</button><button onclick="wrap('[hb]','[/hb]')">隠す</button></div><span class="sep"></span><div class="group"><button onclick="clearAll()">クリア</button></div>
 </div>
<div id="colorTray" class="colorTray">
<div class="colorTrayHead"><span>使用する文字色</span><button onclick="closeColorPalette()">閉じる</button></div>
<div class="colorSwatches"><button class="colorDot" style="background:#000000" data-color="#000000" onclick="selectSwatch(this)" aria-label="#000000"></button><button class="colorDot" style="background:#666666" data-color="#666666" onclick="selectSwatch(this)" aria-label="#666666"></button><button class="colorDot" style="background:#FFFFFF" data-color="#FFFFFF" onclick="selectSwatch(this)" aria-label="#FFFFFF"></button><button class="colorDot selected" style="background:#FF0000" data-color="#FF0000" onclick="selectSwatch(this)" aria-label="#FF0000"></button><button class="colorDot" style="background:#FF7A00" data-color="#FF7A00" onclick="selectSwatch(this)" aria-label="#FF7A00"></button><button class="colorDot" style="background:#FFD400" data-color="#FFD400" onclick="selectSwatch(this)" aria-label="#FFD400"></button><button class="colorDot" style="background:#33A852" data-color="#33A852" onclick="selectSwatch(this)" aria-label="#33A852"></button><button class="colorDot" style="background:#00A6A6" data-color="#00A6A6" onclick="selectSwatch(this)" aria-label="#00A6A6"></button><button class="colorDot" style="background:#0088FF" data-color="#0088FF" onclick="selectSwatch(this)" aria-label="#0088FF"></button><button class="colorDot" style="background:#2457D6" data-color="#2457D6" onclick="selectSwatch(this)" aria-label="#2457D6"></button><button class="colorDot" style="background:#1A0A52" data-color="#1A0A52" onclick="selectSwatch(this)" aria-label="#1A0A52"></button><button class="colorDot" style="background:#7B3FC6" data-color="#7B3FC6" onclick="selectSwatch(this)" aria-label="#7B3FC6"></button><button class="colorDot" style="background:#E649A0" data-color="#E649A0" onclick="selectSwatch(this)" aria-label="#E649A0"></button><button class="colorDot" style="background:#8B4513" data-color="#8B4513" onclick="selectSwatch(this)" aria-label="#8B4513"></button><button class="colorDot" style="background:#B8860B" data-color="#B8860B" onclick="selectSwatch(this)" aria-label="#B8860B"></button><button class="colorDot" style="background:#A9A9A9" data-color="#A9A9A9" onclick="selectSwatch(this)" aria-label="#A9A9A9"></button><button id="rainbowSwatch" class="colorDot rainbowDot" onclick="openFreeColor()" aria-label="自由色" title="自由色"></button></div>
<div class="freeColorInline"><span>現在色</span><span id="currentColorDisplay" class="currentColorDisplay" aria-hidden="true"></span><span id="currentHex">#FF0000</span><button onclick="applyCurrentColor()">この色を使う</button><input id="freeColor" type="color" value="#ff0000" aria-label="自由色" class="nativeColorPicker"></div>
</div>
</header>

<main class="editor">
 <textarea id="body" maxlength="10000" placeholder="ここに日記を書きます"></textarea>
 <span id="bcBox" class="bodyCount"><span id="bc">0</span>/10000</span>
</main>

<footer class="bottom">
 <button onclick="showPreview()">プレビュー</button>
 <button onclick="copyTitle()">タイトルコピー</button>
 <button class="accent" onclick="copyBody()">本文コピー</button>
</footer>
</div>


<div id="preview" class="previewOverlay">
 <div class="previewCard">
  <div class="previewTop"><b>プレビュー　v3.8</b><button onclick="hidePreview()">閉じる</button></div>
  <div id="pt" class="previewTitle">タイトル</div><div id="pb" class="previewBody"></div>
 </div>
</div>

<script>
const title=document.getElementById('title'),body=document.getElementById('body'),tc=document.getElementById('tc'),bc=document.getElementById('bc'),tcBox=document.getElementById('tcBox'),bcBox=document.getElementById('bcBox'),pt=document.getElementById('pt'),pb=document.getElementById('pb');
let savedStart=0,savedEnd=0;
function rememberSelection(){savedStart=body.selectionStart;savedEnd=body.selectionEnd}
['select','keyup','mouseup','touchend','input'].forEach(ev=>body.addEventListener(ev,rememberSelection));

function wrap(a,b){let s=body.selectionStart,e=body.selectionEnd;if(document.activeElement!==body){s=savedStart;e=savedEnd}const v=body.value;body.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);body.focus();body.setSelectionRange(s+a.length,e+a.length);savedStart=s+a.length;savedEnd=e+a.length;changed()}
function sizeWrap(n){wrap('[size='+n+']','[/size]')}function openColorPalette(){
 document.getElementById('colorTray').classList.toggle('open');
}
function closeColorPalette(){document.getElementById('colorTray').classList.remove('open')}
function setCurrentColor(hex,swatch){
 const picker=document.getElementById('freeColor');
 picker.value=hex.toLowerCase();
 document.getElementById('currentHex').textContent=hex.toUpperCase();
 document.getElementById('currentColorDisplay').style.background=hex;
 document.querySelectorAll('.colorDot').forEach(x=>x.classList.remove('selected'));
 if(swatch)swatch.classList.add('selected');
}
function selectSwatch(el){setCurrentColor(el.dataset.color,el)}
function openFreeColor(){
 const picker=document.getElementById('freeColor');
 if(picker.showPicker){try{picker.showPicker();return}catch(e){}}
 picker.click();
}
document.getElementById('freeColor').addEventListener('input',function(){
 setCurrentColor(this.value,document.getElementById('rainbowSwatch'));
});
function applyCurrentColor(){
 const s=body.selectionStart,e=body.selectionEnd,v=body.value;
 const hex=document.getElementById('freeColor').value.toUpperCase();
 const a='[color='+hex+']',b='[/color]';
 body.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);
 const ns=s+a.length,ne=e+a.length;
 changed();
 body.focus();
 setTimeout(()=>body.setSelectionRange(ns,ne),0);
}

function addLink(){let s=body.selectionStart,e=body.selectionEnd;if(document.activeElement!==body){s=savedStart;e=savedEnd}const u=prompt('リンク先URLを入力してください','https://');if(!u)return;const v=body.value,t=v.slice(s,e)||'リンク';body.value=v.slice(0,s)+'[url='+u+']'+t+'[/url]'+v.slice(e);body.focus();savedStart=s;savedEnd=s+('[url='+u+']'+t+'[/url]').length;body.setSelectionRange(savedStart,savedEnd);changed()}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(s){let x=esc(s);return x.replace(/\[size=(1\d|2\d|3[0-2])\]([\s\S]*?)\[\/size\]/gi,'<span style="font-size:$1px">$2</span>').replace(/\[color=(#[0-9A-Fa-f]{6})\]([\s\S]*?)\[\/color\]/gi,'<span style="color:$1">$2</span>').replace(/\[b\]([\s\S]*?)\[\/b\]/gi,'<b>$1</b>').replace(/\[i\]([\s\S]*?)\[\/i\]/gi,'<i>$1</i>').replace(/\[u\]([\s\S]*?)\[\/u\]/gi,'<u>$1</u>').replace(/\[s\]([\s\S]*?)\[\/s\]/gi,'<s>$1</s>').replace(/\[center\]([\s\S]*?)\[\/center\]/gi,'<div style="text-align:center">$1</div>').replace(/\[right\]([\s\S]*?)\[\/right\]/gi,'<div style="text-align:right">$1</div>').replace(/\[left\]([\s\S]*?)\[\/left\]/gi,'<div style="text-align:left">$1</div>').replace(/\[url=([^\]]+)\]([\s\S]*?)\[\/url\]/gi,'<u>$2</u>').replace(/\[hb\]([\s\S]*?)\[\/hb\]/gi,'<span class="hidden">クリックして表示</span>')}
function changed(){tc.textContent=title.value.length;bc.textContent=body.value.length;tcBox.classList.toggle('warn',title.value.length>=45);bcBox.classList.toggle('warn',body.value.length>=9500);localStorage.setItem('lodestoneTitle',title.value);localStorage.setItem('lodestoneBody',body.value)}
function showPreview(){pt.textContent=title.value||'タイトル';pb.innerHTML=body.value?render(body.value):'ここにプレビューが表示されます。';document.getElementById('preview').classList.add('open')}
function hidePreview(){document.getElementById('preview').classList.remove('open')}
async function cp(s,m){try{await navigator.clipboard.writeText(s);alert(m)}catch(e){prompt('コピーしてください',s)}}function copyTitle(){cp(title.value,'タイトルをコピーしました')}function copyBody(){cp(body.value,'本文をコピーしました')}
function clearAll(){
 if(!title.value&&!body.value)return;
 if(!confirm('タイトルと本文をすべて消しますか？'))return;
 title.value='';body.value='';savedStart=0;savedEnd=0;
 localStorage.removeItem('lodestoneTitle');
 localStorage.removeItem('lodestoneBody');
 changed();body.focus();
}
function mode(d){document.body.classList.toggle('dark',d);document.getElementById('mode').textContent=d?'☀️':'🌙';localStorage.setItem('lodestoneDark',d?'1':'0')}function toggleMode(){mode(!document.body.classList.contains('dark'))}
title.value=localStorage.getItem('lodestoneTitle')||'';body.value=localStorage.getItem('lodestoneBody')||'';mode(localStorage.getItem('lodestoneDark')==='1');title.oninput=changed;body.oninput=changed;changed();rememberSelection();
</script>
</body></html>
